  </defs>
  <rect width="800" height="450" fill="url(#night)"/>
  <circle cx="120" cy="70" r="3" fill="#fff"/>
  <circle cx="210" cy="130" r="2" fill="#fff"/>
  <circle cx="640" cy="80" r="2.5" fill="#fff"/>
  <circle cx="700" cy="160" r="2" fill="#fff"/>
  <circle cx="90" cy="320" r="2" fill="#fff"/>
  <circle cx="720" cy="340" r="3" fill="#fff"/>
  <circle cx="400" cy="225" r="132" fill="none" stroke="#ff4fd8" stroke-width="14"/>
  <circle cx="400" cy="225" r="86" fill="none" stroke="#7a6cff" stroke-width="8" opacity=".85"/>
  <circle cx="400" cy="225" r="36" fill="none" stroke="#00f0ff" stroke-width="5" opacity=".9"/>
  <circle cx="532" cy="225" r="28" fill="url(#glow)"/>
